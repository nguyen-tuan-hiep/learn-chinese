<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report the iPhone notch and home indicator; the layout pads for them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101819" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hànyǔ" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Tự học Hànyǔ: làm quen phát âm, học chữ Hán và ôn tập theo giáo trình HSK 1–6." />
    <title>Tự học Hànyǔ · Học tiếng Trung</title>
    <!-- Launch screen: shown while the app loads, laid out like the iOS launch images in public/splash.
         Every size is set here so the app's own CSS, loaded later, moves nothing. -->
    <style>
      html { scrollbar-gutter: stable; }
      #splash { --icon-top: calc(42vh - 56px); position: fixed; inset: 0; z-index: 100; margin: 0; background: #faf7f2; color: #1c1917; font-family: "Be Vietnam Pro", system-ui, sans-serif; text-align: center; }
      .dark #splash { background: #101819; color: #edf4f2; }
      #splash .icon { position: absolute; left: 50%; top: var(--icon-top); width: 112px; height: 112px; margin-left: -56px; border-radius: 25px; overflow: hidden; box-shadow: 0 8px 24px rgb(4 56 45 / 0.22); }
      #splash .icon svg { display: block; width: 100%; height: 100%; }
      #splash b, #splash span { position: absolute; left: 0; right: 0; margin: 0; white-space: nowrap; transition: opacity 0.2s ease; }
      #splash b { top: calc(var(--icon-top) + 138px); font-size: 26px; line-height: 32px; font-weight: 600; }
      #splash span { top: calc(var(--icon-top) + 180px); font-size: 15px; line-height: 20px; font-weight: 400; color: #625a52; }
      .dark #splash span { color: #a7bab7; }
      /* Text waits for Be Vietnam Pro, so it never appears in another font and then changes. */
      #splash:not(.fonts) b, #splash:not(.fonts) span { opacity: 0; }
      /* Exit, once the app is ready: the icon grows and dissolves, the text lifts away,
         and the page underneath settles from 97% to full size. */
      #splash.exit { pointer-events: none; animation: splash-fade 0.3s ease forwards; }
      #splash.exit .icon { animation: splash-icon 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #splash.exit b, #splash.exit span { animation: splash-text 0.25s ease forwards; }
      .from-splash #main-content { transform-origin: 50% 40vh; animation: splash-app 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes splash-fade { to { opacity: 0; visibility: hidden; } }
      @keyframes splash-icon { to { transform: scale(1.35); opacity: 0; } }
      @keyframes splash-text { to { transform: translateY(-6px); opacity: 0; } }
      @keyframes splash-app { from { transform: scale(0.97); } }
      @media (prefers-reduced-motion: reduce) {
        #splash.exit .icon, #splash.exit b, #splash.exit span, .from-splash #main-content { animation: none; }
      }
    </style>
    <script>
      // Apply the saved light or dark theme before the first paint.
      try {
        var theme = (JSON.parse(localStorage.getItem('hanyu-settings') || '{}').state || {}).theme || 'system'
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="icon"><!-- app-icon --></div><b>Tự học Hànyǔ</b><span>Học tiếng Trung từ con số 0</span></div>
    <script>
      (function () {
        var splash = document.getElementById('splash')
        // An app opened from the iPhone home screen starts with a launch image that covers the whole
        // screen, while this page starts below the status bar. Place the icon where the image has it.
        var fromHomeScreen = navigator.standalone === true
        // Right at launch iOS can still report the full screen height for the page, which would
        // count the status bar as 0. So also use the height measured after the last launch.
        var saved = 0
        try { saved = Number(localStorage.getItem('splash-status-bar')) || 0 } catch (e) {}
        var place = function () {
          var screenHeight = fromHomeScreen ? screen.height : innerHeight
          var statusBar = fromHomeScreen ? Math.max(0, screen.height - innerHeight, saved) : 0
          splash.style.setProperty('--icon-top', Math.round(screenHeight * 0.42 - 56 - statusBar) + 'px')
        }
        place()
        // Measure again just before the first frame, once the page has its final size.
        requestAnimationFrame(place)
        var show = function () { splash.classList.add('fonts') }
        if (!document.fonts || !document.fonts.load) return show()
        Promise.race([
          Promise.all([document.fonts.load('600 26px "Be Vietnam Pro"', 'Tự học Hàny'), document.fonts.load('400 15px "Be Vietnam Pro"', 'Học tiếng')]),
          new Promise(function (resolve) { setTimeout(resolve, 600) }),
        ]).then(show, show)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
