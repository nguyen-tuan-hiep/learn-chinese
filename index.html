<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report the iPhone notch and home indicator; the layout pads for them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101819" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hànyǔ" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Tự học Hànyǔ: làm quen phát âm, học chữ Hán và ôn tập theo giáo trình HSK 1–6." />
    <title>Tự học Hànyǔ · Học tiếng Trung</title>
    <!-- Launch screen: shown while the app loads, laid out like the iOS launch images in public/splash. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; background: #faf7f2; color: #1c1917; font-family: "Be Vietnam Pro", system-ui, sans-serif; text-align: center; transition: opacity 0.35s ease, visibility 0.35s; }
      .dark #splash { background: #101819; color: #edf4f2; }
      #splash img { position: absolute; left: 50%; top: calc(42% - 56px); width: 112px; height: 112px; margin-left: -56px; border-radius: 25px; box-shadow: 0 8px 24px rgb(4 56 45 / 0.22); }
      #splash b { position: absolute; inset-inline: 0; top: calc(42% + 82px); font-size: 26px; line-height: 1.2; font-weight: 600; }
      #splash span { position: absolute; inset-inline: 0; top: calc(42% + 124px); font-size: 15px; color: #625a52; }
      .dark #splash span { color: #a7bab7; }
      #splash.hide { opacity: 0; visibility: hidden; }
    </style>
    <script>
      // Apply the saved light or dark theme before the first paint.
      try {
        var theme = (JSON.parse(localStorage.getItem('hanyu-settings') || '{}').state || {}).theme || 'system'
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/app-icon.svg" alt="" /><b>Tự học Hànyǔ</b><span>Học tiếng Trung từ con số 0</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
