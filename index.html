<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report the iPhone notch and home indicator; the layout pads for them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101819" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hànyǔ" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first frame, so the page paints at once; text swaps to the font when it arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <meta name="description" content="Tự học Hànyǔ: làm quen phát âm, học chữ Hán và ôn tập theo giáo trình HSK 1–6." />
    <title>Tự học Hànyǔ · Học tiếng Trung</title>
    <!-- The first frame already has the page colour, so nothing flashes white before the app's CSS loads.
         Opening from the iPhone or iPad home screen first shows the launch images in public/splash. -->
    <style>
      html { scrollbar-gutter: stable; background: #faf7f2; }
      html.dark { background: #101819; }
    </style>
    <script>
      // Apply the saved light or dark theme before the first paint.
      try {
        var theme = (JSON.parse(localStorage.getItem('hanyu-settings') || '{}').state || {}).theme || 'system'
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
